name: Build and Push Node.js to Docker Hub

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  push-to-registry:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # 1. Direct this job to use your 'prod' environment configuration
    environment: prod
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. These secrets will now be securely fetched from the 'prod' environment secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dwellings-be:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dwellings-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Render Deploy Hook
        run: curl -fX POST ${{ secrets.RENDER_DEPLOY_HOOK }}
